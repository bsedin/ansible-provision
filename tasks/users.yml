---
- name: Ensure sudo is installed
  ansible.builtin.apt:

    name: sudo
- name: Add {{ provision_admin_group }} group
  ansible.builtin.group:
    name: "{{ provision_admin_group }}"
    state: present

- name: Add {{ provision_admin_group }} to sudoers file
  ansible.builtin.shell: echo '%{{ provision_admin_group }} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/{{ provision_admin_group }}

- name: Add ansible user
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /bin/bash
    groups: "{{ provision_admin_group }}"
    append: true
    state: present
  with_items:
    - ansible

- name: Set up authorized keys for ansible
  ansible.posix.authorized_key:
    user: ansible
    state: present
    key: "{{ item }}"
  with_file: "{{ provision_ansible_ssh_authorized_keys }}"
